[package]
name = "agentsecret-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Typed request boundary for AgentSecret's qualified Linux guest supervisor"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1.1", features = ["fs"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
